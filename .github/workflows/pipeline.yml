name: ContentSpark Pipeline

# Replaces cron-job.org + FastAPI HTTP triggering. This workflow IS the
# execution environment -- scripts/run_stage.py runs the pipeline directly,
# no server involved, so there's no HTTP timeout risk on a long-running stage.
#
# Schedule mirrors the original staggered PKT design (research -> brief ->
# content -> post), converted to UTC (PKT = UTC+5). The gap between "content"
# and "post" is intentional -- that's the window for Discord approval.
on:
  schedule:
    - cron: '0 3 * * *'  # research -- 8:00 AM PKT
    - cron: '0 5 * * *'  # brief    -- 10:00 AM PKT
    - cron: '0 7 * * *'  # content  -- 12:00 PM PKT
    - cron: '0 9 * * *'  # post     -- 2:00 PM PKT
  workflow_dispatch:
    inputs:
      stage:
        description: 'Pipeline stage to run'
        required: true
        type: choice
        options:
          - research
          - brief
          - content
          - post
          - discover_topics

jobs:
  run-stage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Resolve stage
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "stage=${{ github.event.inputs.stage }}" >> "$GITHUB_OUTPUT"
          else
            case "${{ github.event.schedule }}" in
              '0 3 * * *') echo "stage=research" >> "$GITHUB_OUTPUT" ;;
              '0 5 * * *') echo "stage=brief" >> "$GITHUB_OUTPUT" ;;
              '0 7 * * *') echo "stage=content" >> "$GITHUB_OUTPUT" ;;
              '0 9 * * *') echo "stage=post" >> "$GITHUB_OUTPUT" ;;
              *)
                echo "Unrecognized schedule: ${{ github.event.schedule }}" >&2
                exit 1
                ;;
            esac
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Run stage
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          FREEPIC_API_KEY: ${{ secrets.FREEPIC_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SANITY_PROJECT_ID: ${{ secrets.SANITY_PROJECT_ID }}
          SANITY_DATASET: ${{ secrets.SANITY_DATASET }}
          SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
          SANITY_DEFAULT_AUTHOR_ID: ${{ secrets.SANITY_DEFAULT_AUTHOR_ID }}
          SANITY_DEFAULT_AUTHOR_NAME: ${{ secrets.SANITY_DEFAULT_AUTHOR_NAME }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # Python block-buffers stdout when it isn't a TTY (i.e. always, in
          # Actions) -- print()/logger output can sit in the buffer for
          # minutes and land in the log wildly out of real chronological
          # order (confirmed live: a Cloudflare image-gen log line that
          # should exist was unreadable/undiscoverable in a real run's log
          # because of this). -u forces unbuffered stdout/stderr so log
          # timestamps actually reflect when something happened.
          PYTHONUNBUFFERED: "1"
        run: uv run python -u scripts/run_stage.py --stage "${{ steps.resolve.outputs.stage }}"
