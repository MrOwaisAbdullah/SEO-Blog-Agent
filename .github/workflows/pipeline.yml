name: ContentSpark Pipeline

# Replaces cron-job.org + FastAPI HTTP triggering. This workflow IS the
# execution environment -- scripts/run_stage.py runs the pipeline directly,
# no server involved, so there's no HTTP timeout risk on a long-running stage.
#
# Schedule mirrors the original staggered PKT design (research -> brief ->
# content -> post), converted to UTC (PKT = UTC+5). The gap between "content"
# and "post" is intentional -- that's the window for Discord approval.
# discover_topics runs every ~2 days rather than daily: it proposes 4-5
# candidates per run (each needing a Discord ✅/❌ approval, never
# auto-queued), which is roughly 2 days' worth of research's one-keyword-
# per-day consumption -- running it daily would just pile up unreviewed
# candidates faster than they get approved.
on:
  schedule:
    - cron: '0 1 */2 * *'  # discover_topics -- every ~2 days, 6:00 AM PKT (before research)
    - cron: '0 3 * * *'  # research -- 8:00 AM PKT
    - cron: '0 5 * * *'  # brief    -- 10:00 AM PKT
    - cron: '0 7 * * *'  # content  -- 12:00 PM PKT
    - cron: '0 9 * * *'  # post     -- 2:00 PM PKT
      # repurpose has NO cron entry, deliberately -- it used to run daily
      # and re-post the full recommendation list unprompted, which is
      # exactly the "auto" behavior explicitly rejected in favor of
      # "I decide what to repurpose" (see run_repurpose's recommend-only
      # design). It's still fully reachable on demand: ask the Discord
      # chat agent what's worth repurposing (trigger_stage_tool), or
      # `gh workflow run pipeline.yml -f stage=repurpose`.
    - cron: '0 2 * * 0'  # freshness_sweep -- weekly, Sunday 7:00 AM PKT. Cheap to run
      # often: it only ever acts on posts older than 90 days (see
      # FRESHNESS_SWEEP_MIN_AGE_DAYS in run_stage.py), so most weekly runs
      # will just find nothing eligible yet and do nothing.
    - cron: '0 2 * * 3'  # search_performance_review -- weekly, Wednesday 7:00 AM
      # PKT. Separate day from freshness_sweep so the two review stages
      # don't compete for Gemini/Sanity quota on the same run.
  workflow_dispatch:
    inputs:
      stage:
        description: 'Pipeline stage to run'
        required: true
        type: choice
        options:
          - research
          - brief
          - content
          - post
          - discover_topics
          - edit_post
          - freshness_sweep
          - repurpose
          - search_performance_review
      edit_title:
        description: '(edit_post only) Title (or partial title) of the post to edit'
        required: false
        type: string
      edit_instruction:
        description: '(edit_post only) The specific change to make to that post'
        required: false
        type: string
      repurpose_title:
        description: '(repurpose only, optional) Title of a specific post to draft repurposed copy for. Leave empty to just get recommendations instead.'
        required: false
        type: string

# Without this, a scheduled run and a Discord-triggered manual run (or two
# manual triggers close together) can execute at the same time. Preparation
# Agent always reads a fixed row (approved_unpublished row 2 / first
# available research/brief row) with no claiming mechanism, so two
# overlapping runs can both pick up the same row before either one's writes
# land -- wasted LLM/image calls at minimum, duplicate sheet rows at worst.
# (Sanity publishing itself is now separately idempotent by slug -- see
# lib/sanity_adapter.py -- but this avoids the wasted work in the first
# place.) cancel-in-progress: false means a second trigger queues and runs
# after the first finishes, rather than being dropped.
concurrency:
  group: contentspark-pipeline
  cancel-in-progress: false

jobs:
  run-stage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Resolve stage
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "stage=${{ github.event.inputs.stage }}" >> "$GITHUB_OUTPUT"
          else
            case "${{ github.event.schedule }}" in
              '0 1 */2 * *') echo "stage=discover_topics" >> "$GITHUB_OUTPUT" ;;
              '0 3 * * *') echo "stage=research" >> "$GITHUB_OUTPUT" ;;
              '0 5 * * *') echo "stage=brief" >> "$GITHUB_OUTPUT" ;;
              '0 7 * * *') echo "stage=content" >> "$GITHUB_OUTPUT" ;;
              '0 9 * * *') echo "stage=post" >> "$GITHUB_OUTPUT" ;;
              '0 2 * * 0') echo "stage=freshness_sweep" >> "$GITHUB_OUTPUT" ;;
              '0 2 * * 3') echo "stage=search_performance_review" >> "$GITHUB_OUTPUT" ;;
              *)
                echo "Unrecognized schedule: ${{ github.event.schedule }}" >&2
                exit 1
                ;;
            esac
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Run stage
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SANITY_PROJECT_ID: ${{ secrets.SANITY_PROJECT_ID }}
          SANITY_DATASET: ${{ secrets.SANITY_DATASET }}
          SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
          SANITY_DEFAULT_AUTHOR_ID: ${{ secrets.SANITY_DEFAULT_AUTHOR_ID }}
          SANITY_DEFAULT_AUTHOR_NAME: ${{ secrets.SANITY_DEFAULT_AUTHOR_NAME }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # Only meaningful for stage=edit_post; empty on every other trigger
          # (scheduled runs and workflow_dispatch runs for other stages).
          EDIT_TITLE: ${{ github.event.inputs.edit_title }}
          EDIT_INSTRUCTION: ${{ github.event.inputs.edit_instruction }}
          # Only meaningful for stage=repurpose. Empty means "just recommend
          # candidates, don't draft anything" -- see run_repurpose.
          REPURPOSE_TITLE: ${{ github.event.inputs.repurpose_title }}
          # Python block-buffers stdout when it isn't a TTY (i.e. always, in
          # Actions) -- print()/logger output can sit in the buffer for
          # minutes and land in the log wildly out of real chronological
          # order (confirmed live: a Cloudflare image-gen log line that
          # should exist was unreadable/undiscoverable in a real run's log
          # because of this). -u forces unbuffered stdout/stderr so log
          # timestamps actually reflect when something happened.
          PYTHONUNBUFFERED: "1"
        run: uv run python -u scripts/run_stage.py --stage "${{ steps.resolve.outputs.stage }}"
